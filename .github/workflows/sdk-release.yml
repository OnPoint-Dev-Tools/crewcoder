name: CrewCoder SDK release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the agent, client, and SDK packages after protected approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.8.0
      - run: npm ci --ignore-scripts
      - run: npm run release:check:sdk

  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.8.0
      - run: npm ci --ignore-scripts
      - run: npm run build -w @onpoint-dev-tools/crewcoder-agent
      - run: npm run build -w @onpoint-dev-tools/crewcoder-client
      - run: npm run build -w @onpoint-dev-tools/crewcoder-sdk
      - name: Verify explicit publish gates
        run: node scripts/check-sdk-release.cjs --publish
      # Publish order is dependency order: the SDK depends on exact versions of
      # both the agent and the client, so those must exist on the registry first.
      - name: Publish agent runtime
        run: npm publish -w @onpoint-dev-tools/crewcoder-agent --access public --provenance
      - name: Verify published agent runtime
        run: npm view "@onpoint-dev-tools/crewcoder-agent@$(node -p "require('./crewcoder-agent/package.json').version")" version
      - name: Publish browser client
        run: npm publish -w @onpoint-dev-tools/crewcoder-client --access public --provenance
      - name: Verify published browser client
        run: npm view "@onpoint-dev-tools/crewcoder-client@$(node -p "require('./crewcoder-client/package.json').version")" version
      - name: Publish SDK
        run: npm publish -w @onpoint-dev-tools/crewcoder-sdk --access public --provenance
      - name: Verify published SDK
        run: npm view "@onpoint-dev-tools/crewcoder-sdk@$(node -p "require('./crewcoder-sdk/package.json').version")" version
